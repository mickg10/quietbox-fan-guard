name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest -v
      - run: docker build --build-arg REVISION="$GITHUB_SHA" -t fan-guard-ci .
      - run: FAN_GUARD_DOCKER_IMAGE=fan-guard-ci python -m unittest -v tests.test_docker
